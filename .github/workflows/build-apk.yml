name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check TMDB key
        id: tmdb
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "status=MISSING (secret TMDB_API_KEY not found, logos disabled)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#TMDB_API_KEY} -gt 40 ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TMDB_API_KEY" https://api.themoviedb.org/3/configuration)
            logos=$(curl -s -H "Authorization: Bearer $TMDB_API_KEY" "https://api.themoviedb.org/3/tv/37854/images?include_image_language=en,null" | grep -o '"file_path"' | wc -l)
          else
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.themoviedb.org/3/configuration?api_key=$TMDB_API_KEY")
            logos=$(curl -s "https://api.themoviedb.org/3/tv/37854/images?include_image_language=en,null&api_key=$TMDB_API_KEY" | grep -o '"file_path"' | wc -l)
          fi
          if [ "$code" = "200" ]; then
            echo "status=OK (HTTP 200, One Piece images found: $logos)" >> "$GITHUB_OUTPUT"
          else
            echo "status=REJECTED (HTTP $code, logos disabled)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check MAL client id
        id: mal
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          if [ -z "$MAL_CLIENT_ID" ]; then
            echo "status=MISSING (secret MAL_CLIENT_ID not found)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(curl -s -w '\n%{http_code}' -H "X-MAL-CLIENT-ID: $MAL_CLIENT_ID" "https://api.myanimelist.net/v2/anime/16498?fields=mean")
          code=$(echo "$body" | tail -n1)
          mean=$(echo "$body" | head -n1 | grep -o '"mean":[0-9.]*' | head -n1)
          if [ "$code" = "200" ]; then
            echo "status=OK (HTTP 200, Attack on Titan $mean)" >> "$GITHUB_OUTPUT"
          else
            echo "status=REJECTED (HTTP $code)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (resolve|find)|Execution failed|error:|Unresolved|Duplicate" build.log | head -10 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
          grep -A4 "What went wrong" build.log | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Kiro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kiro-apk
          path: Kiro.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMDB_STATUS: ${{ steps.tmdb.outputs.status }}
          MAL_STATUS: ${{ steps.mal.outputs.status }}
        run: |
          gh release create "build-${{ github.run_number }}" Kiro.apk \
            --title "AniBiar build ${{ github.run_number }}" \
            --notes "Home + Details build. Install Kiro.apk on Android 7.0+. TMDB key: $TMDB_STATUS. MAL client id: $MAL_STATUS" \
            --latest
