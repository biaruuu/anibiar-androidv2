<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Your Kiro sign-in link</title>
</head>
<body style="margin:0;padding:0;background-color:#121214;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#121214" style="background-color:#121214;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <img src="https://raw.githubusercontent.com/biaruuu/anibiar-androidv2/main/docs/email/kiro-logo.png" width="120" height="120" alt="Kiro" border="0" style="display:block;width:120px;height:120px;border:0;outline:none;text-decoration:none;">
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;font-family:Arial,Helvetica,sans-serif;font-size:26px;line-height:30px;font-weight:bold;color:#FFFFFF;">Kiro</td>
        </tr>
        <tr>
          <td bgcolor="#151517" style="background-color:#151517;border:1px solid #343338;border-radius:16px;padding:32px 24px;" align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:28px;font-weight:bold;color:#FFFFFF;padding-bottom:12px;">Sign in to Kiro</td>
              </tr>
              <tr>
                <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#D7D3DA;padding-bottom:28px;">Tap the button below to log in. No password needed. New here? This link also creates your account.</td>
              </tr>
              <tr>
                <td align="center" style="padding-bottom:24px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" bgcolor="#FFFFFF" style="background-color:#FFFFFF;border-radius:10px;">
                        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:bold;color:#000000;text-decoration:none;border-radius:10px;">Sign in to Kiro</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:19px;color:#9B98A0;">Open this on the phone where Kiro is installed. The link works once and expires soon.</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:24px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#9B98A0;">If you didn't ask for this email, you can safely ignore it.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
